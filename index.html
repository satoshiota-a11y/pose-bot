<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI朝活ポーズ提案</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+JP:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
      background-color: #f2c12e;
      background-image: radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1px);
      background-size: 28px 28px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-brick {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .stud-top {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid rgba(0,0,0,0.25);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
      text-shadow: 3px 3px 0px #c0860a, 4px 4px 0px rgba(0,0,0,0.2);
    }

    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.08em;
    }

    .card {
      background: #e3000b;
      border: 4px solid #1a1a1a;
      border-radius: 10px;
      box-shadow: 6px 6px 0px #1a1a1a;
      max-width: 440px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .studs-row {
      background: #cc0009;
      border-bottom: 4px solid #1a1a1a;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .studs-row .stud {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: inherit;
      border: 3px solid rgba(0,0,0,0.3);
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .card-body {
      padding: 32px 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      min-height: 240px;
      justify-content: center;
    }

    .emoji { font-size: 3.5rem; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.3)); }

    .pose-id {
      background: #f2c12e;
      border: 3px solid #1a1a1a;
      border-radius: 20px;
      padding: 3px 14px;
      font-size: 0.75rem;
      font-weight: 900;
      color: #1a1a1a;
      letter-spacing: 0.1em;
    }

    .pose-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
      letter-spacing: 0.04em;
    }

    .how-to {
      background: #ffffff;
      border: 3px solid #1a1a1a;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1.7;
      color: #1a1a1a;
      width: 100%;
      text-align: left;
    }

    .ai-memo {
      background: #f2c12e;
      border: 3px solid #1a1a1a;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #1a1a1a;
      width: 100%;
      text-align: left;
      line-height: 1.7;
    }

    .placeholder {
      color: rgba(255,255,255,0.7);
      font-size: 1rem;
      font-weight: 700;
    }

    button {
      margin-top: 28px;
      padding: 16px 48px;
      font-size: 1.05rem;
      font-weight: 900;
      font-family: 'Nunito', 'Noto Sans JP', sans-serif;
      letter-spacing: 0.1em;
      border: 4px solid #1a1a1a;
      border-radius: 8px;
      background: #006db7;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 5px 5px 0px #1a1a1a;
      transition: transform 0.1s, box-shadow 0.1s;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.3);
    }

    button:hover { background: #0080d6; }
    button:active { transform: translate(3px,3px); box-shadow: 2px 2px 0px #1a1a1a; }

    .fade-in { animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes popIn {
      from { opacity:0; transform:scale(0.85); }
      to   { opacity:1; transform:scale(1); }
    }

    footer {
      margin-top: 24px;
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-brick">
      <div class="stud-top" style="background:#e3000b"></div>
      <div class="stud-top" style="background:#006db7"></div>
      <div class="stud-top" style="background:#00a650"></div>
      <div class="stud-top" style="background:#e3000b"></div>
      <div class="stud-top" style="background:#006db7"></div>
    </div>
    <h1>🤖 AI朝活ポーズ提案</h1>
    <p>MORNING ACTIVITY POSE GENERATOR — ver.2</p>
  </header>

  <div class="card" id="cardWrap">
    <div class="studs-row" id="studsRow">
      <div class="stud"></div><div class="stud"></div><div class="stud"></div>
      <div class="stud"></div><div class="stud"></div><div class="stud"></div>
    </div>
    <div class="card-body" id="card">
      <p class="placeholder">👇 ボタンを押してポーズを受け取ろう！</p>
    </div>
  </div>

  <button onclick="suggestPose()">🧱 ポーズを提案する！</button>

  <footer>30 POSES ／ AI MORNING ACTIVITY ver.2</footer>

  <script>
    const poses = [
      { id:1,  name:"プロンプトエンジニア",   how:"両手で空中にタイプしながら、考え込む表情をする。",                     memo:"言葉の設計こそがAI時代の最強スキル。あなたも今日からエンジニア。", emoji:"✍️" },
      { id:2,  name:"ハルシネーション",        how:"頭を両手で抱え、「え、それ本当？」と困惑した表情をする。",              memo:"AIも間違える。それを見抜く目があなたの武器になる。", emoji:"😵" },
      { id:3,  name:"ファインチューニング",    how:"指先で小さなつまみをゆっくり微調整するような仕草。",                    memo:"大きく変えなくていい。少しの調整が精度を劇的に上げる。", emoji:"🎛️" },
      { id:4,  name:"マルチモーダル",          how:"目・耳・口を順番に指差し、全感覚を使っているアピール。",                memo:"見て、聞いて、読む。AIも五感を持ち始めた時代が来た。", emoji:"👁️" },
      { id:5,  name:"エージェント",            how:"腕を広げて「全部任せろ！」とばかりに前に大きく一歩踏み出す。",          memo:"指示を出すだけで動くAI。あなたはもう指揮官だ。", emoji:"🦾" },
      { id:6,  name:"コンテキストウィンドウ",  how:"両手で大きな四角い窓枠を作り、その中を覗き込む。",                      memo:"どれだけ記憶できるか。窓が広いほど賢くなる。", emoji:"🪟" },
      { id:7,  name:"RAG（検索拡張生成）",     how:"片手で本を開くように、もう片手でメモを取る二段階の仕草。",             memo:"知識を検索して、生成する。調べてから答えるのが賢いやり方。", emoji:"📚" },
      { id:8,  name:"ベクトル検索",            how:"人差し指を斜め上に向け、ピタッと方向を定める。",                        memo:"意味の近さで探す。キーワードじゃなくて「空気感」で検索する時代。", emoji:"🧭" },
      { id:9,  name:"チェーンオブソート",      how:"指を1本ずつ折りながら、ステップを順番に数えていく仕草。",              memo:"考えを声に出して整理する。段階を踏む思考がAIも人も強くする。", emoji:"⛓️" },
      { id:10, name:"ゼロショット",            how:"両手を大きく広げて「なんでもこい！」のポーズ。",                        memo:"例がなくても答えられる。それがゼロショットの底力。", emoji:"🎯" },
      { id:11, name:"アテンション機構",        how:"手を目の上にかざして遠くを見る。「ここ重要！」という表情で。",          memo:"大事なところだけに集中する力。それは人もAIも同じ。", emoji:"🔭" },
      { id:12, name:"トークン",                how:"指先で小さなコインを1枚ずつ丁寧に数える仕草。",                        memo:"言葉は細かく分解される。一つひとつのかけらに意味がある。", emoji:"🪙" },
      { id:13, name:"オーケストレーション",    how:"指揮者のように両手を優雅に振り、全体をまとめる。",                      memo:"複数のAIを束ねて動かす。あなたはマエストロだ。", emoji:"🎼" },
      { id:14, name:"フィードバックループ",    how:"腕で大きな円をゆっくり描く。",                                          memo:"結果を次に活かす。ループするたびに賢くなっていく。", emoji:"🔁" },
      { id:15, name:"リアルタイム推論",        how:"指をパチンと素早く鳴らして、即答のイメージ。",                          memo:"考える時間ゼロ。今この瞬間に答えが出る時代が来た。", emoji:"⚡" },
      { id:16, name:"モデル圧縮",              how:"両手を広げた状態からギュッと近づけて小さく圧縮する。",                  memo:"小さくても賢い。サイズと性能は比例しない。", emoji:"🗜️" },
      { id:17, name:"エンベディング",          how:"両手を重ねて、意味を「埋め込む」ような仕草。",                          memo:"言葉を数字に変換する。それがAIが意味を理解する仕組み。", emoji:"🧩" },
      { id:18, name:"マルチエージェント",      how:"両手がそれぞれ独立して、バラバラに別の動きをする。",                    memo:"複数のAIが同時に動く。チームプレーで問題を解決する時代。", emoji:"👥" },
      { id:19, name:"デプロイ完了",            how:"親指を立てながら「リリース！」と押し出すような動き。",                  memo:"作ったものを世界に届ける瞬間。それが一番気持ちいい。", emoji:"🚀" },
      { id:20, name:"セマンティック検索",      how:"虫眼鏡で意味を探るように、目を細めてじっくり見る仕草。",               memo:"言葉の表面じゃなく、意味で探す。それが次世代の検索。", emoji:"🔍" },
      { id:21, name:"バッチ処理",              how:"両手でたくさんのものをまとめて一気に抱え込む仕草。",                    memo:"まとめてやれば効率が上がる。一気にこなすのがAI流。", emoji:"📦" },
      { id:22, name:"メモリ拡張",              how:"頭の横で両手を外側に広げ、容量が増えていくイメージ。",                  memo:"記憶が増えるほど、できることが広がる。限界を広げ続けよう。", emoji:"🧠" },
      { id:23, name:"トランスフォーマー",      how:"両腕をクロスしてから、変身するように大きく広げる。",                    memo:"AIの革命を起こした仕組み。あなたも今日、変革を起こそう。", emoji:"⚙️" },
      { id:24, name:"データパイプライン",      how:"手を波のように、一方向へなめらかに流す動き。",                          memo:"データは流れてこそ価値になる。止まった情報は死んでいる。", emoji:"🌊" },
      { id:25, name:"合成データ",              how:"両手の指先を合わせて、何かが生まれるような仕草。",                      memo:"ゼロから生み出すデータ。創造こそがAI時代の資産になる。", emoji:"✨" },
      { id:26, name:"マルチタスク",            how:"両手で全く別の動きを同時にやってみる（難しければ笑顔で！）。",         memo:"同時並行が当たり前の時代。あなたの頭もマルチコアで動いている。", emoji:"🤹" },
      { id:27, name:"AGI",                     how:"両腕をゆっくり大きく広げて、「無限の可能性」を全身で表現。",            memo:"汎用人工知能。人類の夢がもうすぐそこまで来ている。", emoji:"🌌" },
      { id:28, name:"モデル評価",              how:"両手でスコアボードを持ち上げるように高く掲げる。",                      memo:"作るだけじゃなく、測ることが大事。数字が品質を証明する。", emoji:"📊" },
      { id:29, name:"量子化",                  how:"両手でアコーディオンのように、押し縮めてコンパクトにする仕草。",        memo:"精度を保ちながら小さくする技術。引き算の美学がここにある。", emoji:"🔢" },
      { id:30, name:"自律進化",                how:"両腕をゆっくり上に伸ばしながら、成長していくイメージで立ち上がる。",   memo:"学び続けるシステムは止まらない。あなたも今日から自律進化中。", emoji:"🌱" },
    ];

    const colors = [
      { bg:'#e3000b', top:'#cc0009' },
      { bg:'#006db7', top:'#0058a0' },
      { bg:'#00a650', top:'#008f45' },
      { bg:'#6e3fa3', top:'#5c348a' },
      { bg:'#f47920', top:'#d6651a' },
    ];

    let lastId = -1;

    function suggestPose() {
      let idx;
      do { idx = Math.floor(Math.random() * poses.length); } while (idx === lastId);
      lastId = idx;
      const p = poses[idx];
      const col = colors[idx % colors.length];

      const wrap = document.getElementById('cardWrap');
      wrap.style.background = col.bg;
      document.getElementById('studsRow').style.background = col.top;

      document.getElementById('card').innerHTML = `
        <div class="emoji fade-in">${p.emoji}</div>
        <div class="pose-id fade-in">No. ${String(p.id).padStart(2,'0')} ／ 30</div>
        <div class="pose-name fade-in">${p.name}</div>
        <div class="how-to fade-in">🙌 ${p.how}</div>
        <div class="ai-memo fade-in">🤖 ${p.memo}</div>
      `;
    }
  </script>
</body>
</html>
